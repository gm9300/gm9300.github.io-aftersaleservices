<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <!-- 修改：去掉 public/，直接指向 page.html -->
    <meta http-equiv="refresh" content="0; url=page.html">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #121212;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 500px;
        }
        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #444;
            border-top-color: #d93a3a;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .msg {
            margin-top: 20px;
            font-size: 16px;
            color: #888;
        }
        .msg a {
            color: #d93a3a;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <p class="msg">Redirecting to <a href="page.html">page.html</a>...</p>
        <p style="font-size:14px; color:#666; margin-top:12px;">
            If you are not redirected automatically, 
            <a href="page.html" style="color:#d93a3a;">click here</a>.
        </p>
    </div>
</body>
</html>
