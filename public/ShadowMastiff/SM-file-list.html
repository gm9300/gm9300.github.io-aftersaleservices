<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>影獒 - 全部资源列表</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            line-height: 1.6;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* ===== 头部 ===== */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .header-top h1 {
            font-size: 28px;
            font-weight: 600;
            color: #ffffff;
            margin: 0;
        }
        .header .subtitle {
            font-size: 14px;
            color: #888888;
            margin-top: 4px;
        }
        .header .badge {
            display: inline-block;
            padding: 3px 14px;
            background-color: #9b59b6;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: #fff;
            margin-top: 6px;
        }

        /* ===== 语言切换器 ===== */
        .lang-switcher {
            position: relative;
            flex-shrink: 0;
        }
        .lang-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            color: #e0e0e0;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
            user-select: none;
            font-family: inherit;
        }
        .lang-btn:hover {
            background: #333;
            border-color: #666;
        }
        .lang-btn .arrow {
            font-size: 11px;
            color: #888;
            transition: transform 0.2s;
        }
        .lang-btn.open .arrow {
            transform: rotate(180deg);
        }
        .lang-menu {
            position: absolute;
            top: calc(100% + 6px);
            right: 0;
            min-width: 100px;
            background: #1e1e1e;
            border: 1px solid #444;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            padding: 6px 0;
            display: none;
            z-index: 200;
            overflow: hidden;
        }
        .lang-menu.show {
            display: block;
        }
        .lang-menu a {
            display: block;
            padding: 8px 18px;
            font-size: 13px;
            color: #d0d0d0;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.12s;
            font-weight: 450;
        }
        .lang-menu a:hover {
            background: #2a2a2a;
        }
        .lang-menu a.active {
            background: #333;
            color: #fff;
            font-weight: 600;
        }

        /* ===== 顶部栏 ===== */
        .top-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            align-items: center;
        }
        .btn-back {
            padding: 10px 20px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 14px;
            transition: background-color 0.3s;
            font-family: inherit;
        }
        .btn-back:hover {
            background-color: #444;
        }
        .btn-back.primary {
            background-color: #9b59b6;
        }
        .btn-back.primary:hover {
            background-color: #8e44ad;
        }
        .stats {
            margin-left: auto;
            font-size: 13px;
            color: #888;
        }
        .stats span {
            color: #9b59b6;
            font-weight: 600;
        }

        /* ===== 筛选器 ===== */
        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            overflow-x: auto;
            padding-bottom: 10px;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 6px 16px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            color: #aaa;
            white-space: nowrap;
            transition: all 0.3s;
            font-family: inherit;
        }
        .filter-btn:hover {
            background: #333;
            color: #fff;
        }
        .filter-btn.active {
            background: #9b59b6;
            color: white;
            border-color: #9b59b6;
        }

        /* ===== 文件列表 ===== */
        .file-list {
            display: grid;
            gap: 12px;
        }
        .file-item {
            background: #1e1e1e;
            padding: 18px 22px;
            border-radius: 8px;
            border: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: border-color 0.3s;
        }
        .file-item:hover {
            border-color: #555;
        }
        .file-info {
            flex: 1;
            min-width: 0;
        }
        .file-info h4 {
            margin: 0 0 4px 0;
            font-size: 15px;
            color: #e0e0e0;
            word-break: break-all;
        }
        .file-meta {
            font-size: 12px;
            color: #777;
        }
        .file-meta .label {
            color: #999;
            margin-right: 2px;
        }
        .file-meta .sep {
            margin: 0 8px;
            color: #555;
        }
        .download-btn {
            padding: 8px 18px;
            background-color: #333;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-size: 13px;
            transition: background-color 0.3s;
            flex-shrink: 0;
            margin-left: 12px;
            font-family: inherit;
            border: none;
            cursor: pointer;
        }
        .download-btn:hover {
            background-color: #444;
        }
        .empty-msg {
            text-align: center;
            color: #666;
            padding: 60px 0;
            font-size: 14px;
        }
        .empty-msg.error {
            color: #d93a3a;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            .file-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
            .download-btn {
                margin-left: 0;
                width: 100%;
                text-align: center;
            }
            .top-bar {
                flex-direction: column;
                align-items: stretch;
            }
            .stats {
                margin-left: 0;
                text-align: center;
            }
            .header-top {
                flex-direction: column;
                align-items: center;
            }
            .lang-switcher {
                align-self: flex-end;
            }
        }
        @media (max-width: 480px) {
            .header-top h1 {
                font-size: 22px;
            }
            .lang-btn {
                padding: 4px 10px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- ===== 头部 ===== -->
        <div class="header">
            <div class="header-top">
                <h1 id="pageTitle" data-i18n="pageTitle">ShadowMastiff - All Resources</h1>
                <div class="lang-switcher">
                    <button class="lang-btn" id="langBtn" onclick="toggleLangMenu()" aria-label="切换语言">
                        <span id="currentLangLabel">EN</span>
                        <span class="arrow">▾</span>
                    </button>
                    <div class="lang-menu" id="langMenu">
                        <a href="#" onclick="setLang('zh')" data-lang="zh">中文</a>
                        <a href="#" onclick="setLang('en')" data-lang="en">English</a>
                    </div>
                </div>
            </div>
            <p class="subtitle" id="pageSubtitle" data-i18n="subtitle">ShadowMastiff Project Document Center – All Files Overview</p>
            <span class="badge">ShadowMastiff</span>
        </div>

        <!-- ===== 顶部操作栏 ===== -->
        <div class="top-bar">
            <a href="/ShadowMastiff/SM-page.html" class="btn-back" id="backMain" data-i18n="backMain">← Back to ShadowMastiff Main</a>
            <a href="/" class="btn-back primary" id="backHome" data-i18n="backHome">← Home</a>
            <div class="stats" id="statsContainer">
                <span id="statsText" data-i18n="stats">Total 0 files</span>
            </div>
        </div>

        <!-- ===== 筛选器 ===== -->
        <div class="filters" id="filters">
            <!-- 由 JS 动态生成 -->
        </div>

        <!-- ===== 文件列表 ===== -->
        <div id="fileList" class="file-list">
            <p class="empty-msg" id="loadingMsg" data-i18n="loading">Loading file list...</p>
        </div>
    </div>

    <script>
        // ============================================================
        //  1. 翻译字典
        // ============================================================
        const I18N = {
            en: {
                pageTitle: 'ShadowMastiff - All Resources',
                subtitle: 'ShadowMastiff Project Document Center – All Files Overview',
                backMain: '← Back to ShadowMastiff Main',
                backHome: '← Home',
                stats: 'Total {count} files',
                filterAll: 'All',
                viewDownload: 'View/Download',
                emptyCategory: 'No files in this category',
                loading: 'Loading file list...',
                loadFailed: 'Load failed, please ensure server is running.',
                categoryLabel: 'Category',
                sizeLabel: 'Size',
                typeLabel: 'Type',
            },
            zh: {
                pageTitle: '影獒 - 全部资源列表',
                subtitle: 'ShadowMastiff 项目文档中心 – 所有文件一览',
                backMain: '← 返回影獒主界面',
                backHome: '← 返回首页',
                stats: '共 {count} 个文件',
                filterAll: '全部',
                viewDownload: '查看/下载',
                emptyCategory: '该分类下暂无文件',
                loading: '正在加载文件列表...',
                loadFailed: '加载失败，请确保服务器已启动',
                categoryLabel: '分类',
                sizeLabel: '大小',
                typeLabel: '类型',
            }
        };

        // ============================================================
        //  2. 状态 & 工具
        // ============================================================
        let currentLang = 'en';
        let allFiles = [];
        let currentCategory = 'all'; // 当前筛选分类

        function t(key, params) {
            let text = I18N[currentLang]?.[key] || key;
            if (params) {
                for (let k in params) {
                    text = text.replace(`{${k}}`, params[k]);
                }
            }
            return text;
        }

        function getLangLabel() {
            return currentLang === 'en' ? 'EN' : '中文';
        }

        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ============================================================
        //  3. 语言切换
        // ============================================================
        function setLang(lang) {
            if (lang === currentLang) {
                closeLangMenu();
                return;
            }
            currentLang = lang;
            localStorage.setItem('shadowmastiff_lang', lang);
            renderStaticTexts();
            // 刷新文件列表（因为按钮文字和元数据标签需要更新）
            if (allFiles.length) {
                applyFilter(currentCategory);
            } else {
                // 如果还没加载数据，刷新加载信息
                document.getElementById('loadingMsg').textContent = t('loading');
            }
            // 更新筛选器中的“全部”按钮文字
            updateFilterAllButton();
            closeLangMenu();
        }

        function toggleLangMenu() {
            const menu = document.getElementById('langMenu');
            const btn = document.getElementById('langBtn');
            menu.classList.toggle('show');
            btn.classList.toggle('open');
        }

        function closeLangMenu() {
            const menu = document.getElementById('langMenu');
            const btn = document.getElementById('langBtn');
            menu.classList.remove('show');
            btn.classList.remove('open');
        }

        // 点击外部关闭下拉
        document.addEventListener('click', function(e) {
            const switcher = document.querySelector('.lang-switcher');
            if (switcher && !switcher.contains(e.target)) {
                closeLangMenu();
            }
        });

        // ============================================================
        //  4. 渲染静态文本 (data-i18n)
        // ============================================================
        function renderStaticTexts() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                const val = t(key);
                if (val !== undefined) {
                    // 保留子元素结构（如统计中的数字）
                    if (el.hasChildNodes() && el.children.length > 0) {
                        let textNodeFound = false;
                        el.childNodes.forEach(node => {
                            if (node.nodeType === Node.TEXT_NODE && node.textContent.trim() !== '') {
                                node.textContent = val;
                                textNodeFound = true;
                            }
                        });
                        if (!textNodeFound) {
                            el.appendChild(document.createTextNode(val));
                        }
                    } else {
                        el.textContent = val;
                    }
                }
            });
            // 更新语言按钮
            document.getElementById('currentLangLabel').textContent = getLangLabel();
            // 高亮菜单
            document.querySelectorAll('.lang-menu a').forEach(a => {
                const lang = a.getAttribute('data-lang');
                a.classList.toggle('active', lang === currentLang);
            });
            // 更新统计（如果已经加载）
            updateStatsText();
        }

        // ============================================================
        //  5. 统计更新
        // ============================================================
        function updateStatsText() {
            const statsEl = document.getElementById('statsText');
            if (statsEl) {
                const count = allFiles.length;
                statsEl.textContent = t('stats', { count: count });
            }
        }

        // ============================================================
        //  6. 筛选器“全部”按钮更新
        // ============================================================
        function updateFilterAllButton() {
            const allBtn = document.querySelector('.filter-btn[data-category="all"]');
            if (allBtn) {
                allBtn.textContent = t('filterAll');
            }
        }

        // ============================================================
        //  7. 加载文件列表
        // ============================================================
        const PROJECT_NAME = 'ShadowMastiff';

        async function loadFiles() {
            const listEl = document.getElementById('fileList');
            try {
                listEl.innerHTML = `<p class="empty-msg">${t('loading')}</p>`;

                const response = await fetch(`/api/project-files?project=${PROJECT_NAME}`);
                const result = await response.json();
                if (result.success) {
                    allFiles = result.data;
                    updateStatsText();
                    generateFilters();
                    applyFilter('all'); // 默认显示全部
                } else {
                    listEl.innerHTML = `<p class="empty-msg error">${t('loadFailed')}</p>`;
                }
            } catch (error) {
                console.error(error);
                listEl.innerHTML = `<p class="empty-msg error">${t('loadFailed')}</p>`;
            }
        }

        // ============================================================
        //  8. 生成筛选按钮
        // ============================================================
        function generateFilters() {
            const container = document.getElementById('filters');
            const categories = [...new Set(allFiles.map(f => f.category))];

            let html = `<button class="filter-btn active" data-category="all" onclick="filterFiles('all', this)">${t('filterAll')}</button>`;
            categories.forEach(cat => {
                html += `<button class="filter-btn" data-category="${escapeHtml(cat)}" onclick="filterFiles('${escapeHtml(cat)}', this)">${escapeHtml(cat)}</button>`;
            });
            container.innerHTML = html;
            currentCategory = 'all';
        }

        // ============================================================
        //  9. 筛选 & 渲染
        // ============================================================
        function filterFiles(category, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            currentCategory = category;
            applyFilter(category);
        }

        function applyFilter(category) {
            const filtered = category === 'all' ? allFiles : allFiles.filter(f => f.category === category);
            renderFiles(filtered);
        }

        function renderFiles(files) {
            const container = document.getElementById('fileList');
            if (!files || files.length === 0) {
                container.innerHTML = `<p class="empty-msg">${t('emptyCategory')}</p>`;
                return;
            }

            const categoryLabel = t('categoryLabel');
            const sizeLabel = t('sizeLabel');
            const typeLabel = t('typeLabel');
            const viewDownload = t('viewDownload');

            container.innerHTML = files.map(file => {
                // 安全转义
                const title = escapeHtml(file.title);
                const category = escapeHtml(file.category);
                const size = escapeHtml(file.size);
                const ext = escapeHtml(file.ext);
                const filePath = escapeHtml(file.file_path);

                return `
                    <div class="file-item">
                        <div class="file-info">
                            <h4>${title}</h4>
                            <div class="file-meta">
                                <span class="label">${categoryLabel}:</span> ${category}
                                <span class="sep">|</span>
                                <span class="label">${sizeLabel}:</span> ${size}
                                <span class="sep">|</span>
                                <span class="label">${typeLabel}:</span> ${ext}
                            </div>
                        </div>
                        <a href="${filePath}" target="_blank" class="download-btn">${viewDownload}</a>
                    </div>
                `;
            }).join('');
        }

        // ============================================================
        //  10. 初始化
        // ============================================================
        window.onload = function() {
            // 读取保存的语言
            const saved = localStorage.getItem('shadowmastiff_lang');
            if (saved === 'zh' || saved === 'en') {
                currentLang = saved;
            } else {
                currentLang = 'en';
            }

            // 先渲染静态文本（包括语言按钮）
            renderStaticTexts();

            // 加载文件列表（内部会调用 generateFilters 和 renderFiles）
            loadFiles();

            // 关闭下拉（点击外部已处理）
        };

        // 暴露全局函数给 onclick
        window.setLang = setLang;
        window.toggleLangMenu = toggleLangMenu;
        window.filterFiles = filterFiles;
        window.applyFilter = applyFilter;
        window.loadFiles = loadFiles;
    </script>
</body>
</html>
